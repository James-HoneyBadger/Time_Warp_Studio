name: Native (C++)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'Examples/**'
      - 'VERSION'
      - '.github/workflows/native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'Examples/**'
      - 'VERSION'
      - '.github/workflows/native.yml'
  # Available to run by hand, because "does it build here" is a question worth
  # being able to ask without pushing a commit.
  workflow_dispatch:

# The C++ side has no other coverage. Every one of the checks below exists because
# it caught a real defect during the port:
#
#  * `-Werror` with the strict flag set -- the warnings in this project have been
#    the outer edge of genuine mistakes, not style.
#  * The Debug tree, because Qt's Q_ASSERT and the standard library's hardening
#    are only live without -DNDEBUG. A use-after-free in a queued Qt connection
#    reproduced 6 times out of 6 there and never in Release.
#  * ASan, which is what actually named that defect: `stack-use-after-return`.
#  * The differential harnesses, which are the only check that the ports agree
#    with the Python reference they replace.
#  * `--version` and `--help`, so the shipped entry point is known to start and
#    exit rather than merely known to link.

jobs:
  native:
    name: Build, test and sanitise
    runs-on: ubuntu-24.04
    env:
      # No display anywhere in this job, and the tests set this themselves; it is
      # set here too so a failure to set it in a new test shows up as a failure
      # rather than as a hang waiting for a screen.
      QT_QPA_PLATFORM: offscreen
      # X11 rather than wayland for the offscreen plugin's font handling.
      QT_QPA_PLATFORM_PLUGIN_PATH: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            qt6-base-dev qt6-base-dev-tools libsqlite3-dev \
            libgl1-mesa-dev libxkbcommon-dev

      - name: Show the toolchain
        run: |
          cmake --version
          g++ --version
          pkg-config --modversion Qt6Core || true

      # A configure that cannot find Qt6 Widgets still succeeds and silently
      # skips the whole UI section, which is exactly the shape of failure that
      # would make this job green while testing nothing.
      #
      # Written as an `if` rather than `! grep -q ...`: bash's `set -e` does not
      # abort on a command whose status is inverted with `!`, so that form would
      # pass whether or not the pattern was found.
      - name: Configure and build (Release)
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
          if grep -q "skipping the widget UI" configure.log; then
            echo "::error::Qt6 Widgets was not found, so the UI was skipped. No UI test ran."
            exit 1
          fi
          cmake --build native/build --parallel

      # --version and --help must not need a display, a settings file, or an
      # already-configured window layout.
      - name: The entry point starts and exits
        run: |
          ./native/build/time_warp_ide --version
          ./native/build/time_warp_ide --help
          # A file that cannot be opened must not block on a dialog. This is a
          # regression test for a startup path that did exactly that.
          ./native/build/time_warp_ide --screenshot /tmp/smoke.png \
            --size 800x600 /nonexistent/not-a-program.bas
          test -s /tmp/smoke.png

      - name: Render the window
        run: |
          # `Examples/...` from the repository root: `../Examples` pointed outside
          # the checkout, so the render photographed an empty window and the step
          # passed anyway -- a missing file is reported on stderr, not fatal.
          ./native/build/time_warp_ide --reset --size 1400x900 \
            --screenshot native/build/layout.png Examples/basic/hello.bas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-render
          path: native/build/layout.png
          if-no-files-found: warn

      - name: Test (Release)
        run: ctest --test-dir native/build --output-on-failure

      # The three checks below run the project's own Makefile targets rather than
      # repeating their CMake invocations here. The Makefile is what a developer
      # runs, so a Makefile that has rotted fails this job instead of failing
      # nobody until the next release.
      #
      # `make -C native test-debug` builds a second, unoptimised tree. Qt's
      # Q_ASSERT and libstdc++'s hardening are only live without -DNDEBUG, and
      # that tree is where a use-after-free in a queued Qt connection reproduced
      # six times out of six after never appearing in Release.
      - name: Test (Debug, assertions active)
        run: make -C native test-debug

      # ASan is what *named* that defect: `stack-use-after-return`. A separate
      # tree per sanitizer, because reusing one directory across two sets of
      # sanitizer flags is a rebuild that depends on CMake noticing the flag
      # change.
      - name: Test (AddressSanitizer)
        run: make -C native asan

      - name: Test (UndefinedBehaviorSanitizer)
        run: |
          make -C native asan ASAN=undefined SAN_DIR=build-ubsan \
            ASAN_FLAGS='-fsanitize=undefined -fno-omit-frame-pointer -g'

      # The differential gates: the C++ ports must agree with the Python
      # implementation on the cases where agreement is expected, and must match
      # the documented list of known divergences exactly. A new divergence fails.
      #
      # The greps are padded-safe on purpose: the report lines are column-aligned,
      # so `UNEXPECTED mismatches: 0` with one space matches nothing and the guard
      # would pass while asserting nothing at all.
      - name: 'Differential check: expressions'
        working-directory: native/tools
        run: |
          python3 differential_check.py ../build/expr_cli | tee differential-expr.log
          grep -qE "UNEXPECTED mismatches *: *0" differential-expr.log
        env:
          PYTHONPATH: ${{ github.workspace }}/native/bridge

      - name: 'Differential check: Scheme'
        working-directory: native/tools
        run: |
          python3 scheme_differential_check.py | tee differential-scheme.log
          grep -qE "UNEXPECTED mismatches *: *0" differential-scheme.log
        env:
          PYTHONPATH: ${{ github.workspace }}/native/bridge

      # The native language gate runs every command-table row and every example
      # for a ported language through both engines. Its exit code is the verdict;
      # `pipefail` keeps `tee` from hiding it.
      - name: 'Differential check: native languages'
        working-directory: native/tools
        run: |
          set -euo pipefail
          python3 lang_differential_check.py | tee differential-lang.log
        env:
          PYTHONPATH: ${{ github.workspace }}/native/bridge

      # Every example program, in every language, through the bridge. This is the
      # gate for the failure the unit tests cannot see: a language that runs
      # successfully and draws nothing, which is exactly what a user reports as
      # "the graphics don't show up". Needs only python3 -- the bridge's import
      # chain is deliberately Qt-free, so this job does not install PySide6.
      - name: Example programs through the bridge
        run: python3 native/tools/example_smoke.py

      # Every command in the command table, first as a whole program through the
      # reference engine, then as a REPL submission through the native API. The
      # REPL is a separate execution path: it preserves bindings, replaces the
      # program text each time and runs whole-program languages as one entry.
      - name: Every language command
        run: python3 native/tools/command_matrix.py

      - name: Every language command through the REPL
        run: python3 native/tools/repl_matrix.py

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-differential-logs
          path: native/tools/differential-*.log
          if-no-files-found: ignore

  # The two desktops the release also builds for. Everything above runs on
  # Linux with GCC, which is one of the three compilers this project ships
  # under; MSVC and Apple's Clang each reject things GCC accepts (two warning
  # options that do not exist, an unused lambda capture, the system code page
  # for UTF-8 sources). Catching that here costs a build; catching it at release
  # time costs a tag.
  cross-platform:
    name: Build and test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            shell: pwsh
          - name: macOS
            runner: macos-latest
            shell: bash
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # macOS takes the newest Qt: 6.8 and 6.9 link `-framework AGL`, a framework
      # macOS 26's SDK no longer ships, and 6.10 stopped. Qt 6.12 is universal
      # (arm64 and x86_64) and declares macOS 14.4 as its floor, which is what
      # the bundle says too.
      #
      # Windows is pinned to 6.8.3 because that is the Qt the suite has been run
      # against there; bumping it is its own change, not a side effect of this one.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ startsWith(matrix.runner, 'macos') && '6.12.*' || '6.8.3' }}
          cache: true

      # Qt ships SQLite's plugin, not the library the application links, and the
      # Windows image has no system copy. The static-marked triplet is the one
      # that matches Qt's dynamic C runtime, so no DLL is left undeployed.
      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows-static-md --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The compiler environment, rather than a generator name. `windows-latest`
      # moved to Visual Studio 2026, and a pinned `-G "Visual Studio 17 2022"`
      # then finds no instance at all; `vcvars` asks the installed Visual Studio
      # who it is, whatever version that is. Ninja is preinstalled and does not
      # care either.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S native -B native/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path configure.log -Pattern "skipping the widget UI" -Quiet) {
            Write-Error "Qt6 Widgets was not found, so the UI was skipped."
            exit 1
          }

      # The deployment target is the one the released bundle declares (macOS 14.4,
      # Qt 6.12's floor), not the runner's own SDK default. That is the difference
      # that matters: an API that is missing below the floor must fail here and
      # not only at release time -- which is how the floating-point <charconv>
      # overloads were found to be unavailable below 13.3.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4 2>&1 | tee configure.log
          if grep -q "skipping the widget UI" configure.log; then
            echo "::error::Qt6 Widgets was not found, so the UI was skipped."
            exit 1
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build native/build --parallel

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build native/build --parallel

      # `--timeout` turns a hung test into a named failure with the output it had
      # produced: a blocking modal dialog or a process that never exits would
      # otherwise hold the job open until the runner tires of it.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: ctest --test-dir native/build --timeout 180 --output-on-failure

      - name: Test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 30
        run: ctest --test-dir native/build --timeout 180 --output-on-failure

      # The bridge is the only part of the product that runs Python, and it is what
      # a lesson check uses. This drives it directly -- requests on stdin, the JSON
      # lines back -- so a platform where it cannot answer shows its traceback here
      # instead of as a row of test timeouts that say only "no reply". Closing
      # stdin is the documented one-shot use, and `always()` so it runs after the
      # failing test step rather than instead of it.
      - name: The bridge worker answers (Windows)
        if: always() && runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          $env:PYTHONPATH = Join-Path $PWD "native/bridge"
          # Both requests the failed tests wait on: the curriculum, which is a
          # file read, and a run, which starts an interpreter.
          $requests = @(
            '{"t":"lessons"}',
            '{"t":"run","language":"basic","source":"10 PRINT ""HI""\n20 END\n","name":"hello.bas"}'
          )
          $output = $requests | & python native/bridge/worker.py 2>&1 | Out-String
          Write-Host $output
          $missing = @()
          if ($output -notmatch '"t":"lessons"') { $missing += "lessons" }
          if ($output -notmatch '"t":"done"') { $missing += "run" }
          if ($missing.Count -gt 0) {
            Write-Error ("the worker never answered: " + ($missing -join ", "))
            exit 1
          }

      - name: The entry point starts and exits (Windows)
        if: runner.os == 'Windows'
        run: |
          $app = (Resolve-Path "native/build/time_warp_ide.exe").Path
          $version = Start-Process -FilePath $app -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($version.ExitCode -ne 0) { exit $version.ExitCode }
          $shot = Join-Path $env:RUNNER_TEMP "smoke.png"
          $render = Start-Process -FilePath $app -ArgumentList "--screenshot", $shot -NoNewWindow -Wait -PassThru
          if ($render.ExitCode -ne 0) { exit $render.ExitCode }
          if (-not (Test-Path $shot)) { Write-Error "no screenshot"; exit 1 }

      - name: The entry point starts and exits (macOS)
        if: runner.os == 'macOS'
        run: |
          bundle=$(find native/build -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$bundle"
          app=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f | head -1)
          test -x "$app"
          "$app" --version
          "$app" --help > /dev/null
          "$app" --screenshot "${RUNNER_TEMP:-/tmp}/smoke.png" --size 800x600
          test -s "${RUNNER_TEMP:-/tmp}/smoke.png"

  # The Windows 7 build, which is a real build rather than a look: Qt 6 requires
  # Windows 10, so this one is Qt 5.15.2 -- the last Qt that runs on 7 SP1 -- and
  # `-DTIME_WARP_QT5=ON` compiles the same sources against it. `TIME_WARP_WIN7`
  # states the API level, so a call into anything newer fails here rather than on
  # the target machine.
  #
  # What this cannot prove is that the result runs on Windows 7: no runner image
  # is older than Windows Server 2019. It proves the build is possible, the whole
  # suite passes against Qt 5, and no newer API is used.
  windows-7:
    name: Build and test for Windows 7 (Qt 5.15)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # 5.15.2 is the newest Qt 5.15 with an MSVC binary package, and it is built
      # for the 2019 toolset. Its DLLs declare Windows 7 as their floor.
      - name: Install Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Install SQLite (Windows)
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows-static-md --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The 2019 toolset when the image still carries it, which is the one this Qt
      # was built with and the one whose runtime is documented to run on Windows 7.
      # The image's own toolset when it does not: MSVC 2015-2022 are binary
      # compatible, so the mix links, but the note in the release says which one
      # built the artifact.
      - name: Set up MSVC 2019
        id: msvc2019
        continue-on-error: true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - name: Set up MSVC (default toolset)
        if: steps.msvc2019.outcome != 'success'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          if ("${{ steps.msvc2019.outcome }}" -ne "success") {
            Write-Host "::warning::the v142 toolset is not on this image; using the default one"
          }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S native -B native/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTIME_WARP_QT5=ON `
            -DTIME_WARP_WIN7=ON `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path configure.log -Pattern "skipping the widget UI" -Quiet) {
            Write-Error "Qt5 Widgets was not found, so the UI was skipped."
            exit 1
          }
          # The point of the job: prove Qt 5 was the one it built against.
          if (-not (Select-String -Path configure.log -Pattern "Qt5 .* found: building the widget UI" -Quiet)) {
            Write-Error "the configure did not report a Qt5 widget UI"
            exit 1
          }

      - name: Build
        run: cmake --build native/build --parallel

      - name: Test
        timeout-minutes: 30
        run: ctest --test-dir native/build --timeout 180 --output-on-failure

      - name: The entry point starts and exits
        run: |
          $app = (Resolve-Path "native/build/time_warp_ide.exe").Path
          $version = Start-Process -FilePath $app -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($version.ExitCode -ne 0) { exit $version.ExitCode }
          $shot = Join-Path $env:RUNNER_TEMP "win7.png"
          $render = Start-Process -FilePath $app -ArgumentList "--screenshot", $shot -NoNewWindow -Wait -PassThru
          if ($render.ExitCode -ne 0) { exit $render.ExitCode }
          if (-not (Test-Path $shot)) { Write-Error "no screenshot"; exit 1 }
