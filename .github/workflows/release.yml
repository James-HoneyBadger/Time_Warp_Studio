name: Release

# Cutting a release: verify the tag, build the artifact for each desktop the
# application runs on (Linux packages and AppImage, a Windows installer and ZIP,
# a universal macOS disk image), publish the container image to GitHub Packages,
# and attach every artifact to a GitHub Release. The release job runs in the
# `production` environment, which is what makes GitHub show a Deployment for it —
# this project has no hosted service, so "deployment" here means "a published
# release that users can install", and the environment is the record and the
# approval gate for it.
#
# The gates that decide whether the code is *good* (the 14 suites, the parity
# gates, the lesson validation) live in `native.yml` and `docs.yml` and run on
# every push. This workflow re-runs the test suite once because a release is the
# one build whose provenance matters: an artifact must be produced by a tree that
# passed, not by a tree that was next to one that passed.

on:
  push:
    tags:
      - 'v*'
  # Available by hand, so the pipeline can be exercised without spending a tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match VERSION), e.g. 16.0.0'
        required: true

permissions:
  contents: write
  packages: write

# One release at a time. Never cancel: a half-pushed image and a half-written
# release are worse than a queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  # `IMAGE_NAME` is not set here: `github.repository` keeps the case of the owner
  # and the repository, and an OCI repository name must be lowercase, so
  # `ghcr.io/James-HoneyBadger/Time_Warp_Studio` gets all the way to buildx and
  # fails there ("repository name must be lowercase"). Each job that needs it
  # lowercases it into `GITHUB_ENV` first.

jobs:
  verify:
    name: Verify the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          file_version=$(tr -d '[:space:]' < VERSION)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            wanted="${{ inputs.version }}"
          else
            # A tag is `v16.0.0`; the version is what follows.
            wanted="${GITHUB_REF_NAME#v}"
          fi
          if [ "$wanted" != "$file_version" ]; then
            echo "::error::Refusing to release $wanted: VERSION says $file_version."
            echo "::error::Bump VERSION and the changelog first, then retag."
            exit 1
          fi
          # The changelog is the other half of a release, and version_sync.py
          # already knows how to check the paperwork. Running it here means a
          # missing section fails before anything is built.
          python3 Scripts/version_sync.py
          echo "version=$wanted" >> "$GITHUB_OUTPUT"

  build:
    name: Build the Linux artifact (${{ matrix.arch }})
    needs: verify
    strategy:
      # One architecture failing must not hide the other's result: an ARM runner
      # image that has gone away should not stop the x86_64 release.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            # The AppImage is x86_64 only: its Qt bundling tool has an ARM
            # build, but this pipeline does not exercise it yet, and an artifact
            # nobody has run is not one to publish.
            appimage: true
          # `arm64` is GitHub's hosted ARM runner, the same distribution as its
          # x86 sibling, which is what keeps the two builds' Qt versions equal.
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake qt6-base-dev qt6-base-dev-tools libsqlite3-dev \
            libgl1-mesa-dev libxkbcommon-dev

      - name: Configure, requiring the widget UI
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr 2>&1 | tee configure.log
          # A configure that cannot find Qt6 Widgets still exits 0 and skips the
          # whole UI, which would publish an artifact that is not the product.
          if grep -q "skipping the widget UI" configure.log; then
            echo "::error::Qt6 Widgets was not found, so the UI was skipped."
            exit 1
          fi
          cmake --build native/build --parallel

      - name: Test what is about to ship
        run: |
          ctest --test-dir native/build --output-on-failure
          ./native/build/time_warp_ide --version
          ./native/build/time_warp_ide --help > /dev/null

      - name: Stage the install tree
        run: |
          make -C native install DESTDIR="$PWD/stage" PREFIX=/usr
          # The tarball is unpacked into /, so the tree has to carry the real
          # paths a desktop expects: /usr/bin, /usr/share/applications, and the
          # icon where the theme looks for it.
          find stage -type f | sort | sed 's|^stage||' > staged-files.txt
          cat staged-files.txt

      - name: Package
        run: |
          version="${{ needs.verify.outputs.version }}"
          name="time-warp-studio-${version}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          # The payload is the staged tree, minus the leading `stage/`, plus the
          # files that make it usable without the repository -- the licence and
          # the two READMEs. The example programs are already in the staged tree,
          # at /usr/share/time-warp-studio/examples, because the tarball is
          # unpacked into `/` and the install tree is what it ships.
          cp -a stage/usr "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cp native/README.md "dist/$name/README-native.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          ls -l dist

      - name: Build the .deb and .rpm
        run: |
          # `rpm` is what gives CPack an `rpmbuild`; the DEB generator needs
          # nothing that is not already here.
          sudo apt-get install -y --no-install-recommends rpm
          cd native/build
          cpack -G "DEB;RPM"
          cd ../..
          mv native/build/time-warp-studio_*.deb native/build/time-warp-studio-*.rpm dist/ 2>/dev/null || true
          # One file per artifact, matching the tarball's: a single combined
          # checksum file is one more thing to open before you can verify a
          # download.
          ( cd dist && for package in *.deb *.rpm; do sha256sum "$package" > "$package.sha256"; done )
          ls -l dist

      - name: Build an AppImage
        if: matrix.appimage
        env:
          # The runner has no FUSE, so the packaging tools are run extracted.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          version="${{ needs.verify.outputs.version }}"
          # FUSE is what an AppImage normally needs to *mount* itself, but the
          # tools here are run extracted, so it is not a requirement -- and noble
          # renamed the package to `libfuse2t64`, so asking for the old name is
          # how this step would fail. `file` is what linuxdeploy inspects with.
          sudo apt-get install -y --no-install-recommends file
          # linuxdeploy bundles the Qt libraries and the platform plugins into the
          # AppDir and writes the single-file runtime. The Qt plugin beside it is
          # what finds them: an AppImage built without it starts on the user's
          # machine and immediately reports a missing platform plugin.
          curl -fsSLo linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p AppDir
          # The examples arrive with the install rules, inside the image, where
          # File > Open Example finds them: an AppImage has no package manager to
          # fetch them later.
          DESTDIR="$PWD/AppDir" cmake --install native/build --prefix /usr
          if [ -x /usr/lib/qt6/bin/qmake ]; then
            export QMAKE=/usr/lib/qt6/bin/qmake
          fi
          export OUTPUT="Time_Warp_Studio-${version}-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/time-warp-studio.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/time-warp-studio.png \
            --output appimage
          mv ./*.AppImage "dist/$OUTPUT"
          ( cd dist && sha256sum "$OUTPUT" > "$OUTPUT.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifact-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  build-windows:
    name: Build the Windows installer
    needs: verify
    runs-on: windows-latest
    # PowerShell is the shell the runner images use; `defaults` makes the
    # multi-line commands below read as one command rather than as cmd.exe's
    # line continuation rules.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Pinned: 6.8.3 is the Qt the suite is validated against on Windows.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # Qt ships its own SQLite plugin but not the library the application links
      # against, so the C library comes from vcpkg. It is one small package and
      # the runner already has vcpkg bootstrapped.
      - name: Install SQLite
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) {
            Write-Host "vcpkg is not bootstrapped; doing that first"
            & (Join-Path $env:VCPKG_INSTALLATION_ROOT "bootstrap-vcpkg.bat")
          }
          # The static library, with the dynamic C runtime Qt also uses: a
          # DLL would have to be deployed beside the executable and would be
          # the one file windeployqt does not know about.
          & $vcpkg install sqlite3:x64-windows-static-md --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The compiler environment rather than a generator name: `windows-latest`
      # now carries Visual Studio 2026, and a pinned `-G "Visual Studio 17 2022"`
      # finds no instance of it. `vcvars` asks whatever is installed; Ninja is
      # preinstalled and takes the compiler it finds on the PATH.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S native -B native/build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A configure that cannot find Qt6 Widgets still exits 0 and skips the
          # whole UI, which would publish an installer with no application in it.
          if (Select-String -Path configure.log -Pattern "skipping the widget UI" -Quiet) {
            Write-Error "Qt6 Widgets was not found, so the UI was skipped."
            exit 1
          }

      - name: Build
        run: cmake --build native/build --parallel

      - name: Test what is about to ship
        run: |
          ctest --test-dir native/build --timeout 180 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # `Start-Process -Wait` rather than `&`, which for a GUI-subsystem
          # executable may return before the application has exited and leave
          # $LASTEXITCODE describing something else.
          $app = (Resolve-Path "native/build/time_warp_ide.exe").Path
          $version = Start-Process -FilePath $app -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($version.ExitCode -ne 0) { exit $version.ExitCode }
          # The window actually paints: the same offscreen screenshot the Linux
          # job takes, and the one check that proves the UI is not merely linked.
          $shot = Join-Path $env:RUNNER_TEMP "window.png"
          $render = Start-Process -FilePath $app -ArgumentList "--screenshot", $shot -NoNewWindow -Wait -PassThru
          if ($render.ExitCode -ne 0) { exit $render.ExitCode }
          if (-not (Test-Path $shot) -or (Get-Item $shot).Length -eq 0) {
            Write-Error "the offscreen screenshot was not written"
            exit 1
          }

      - name: Package
        run: |
          # NSIS is the installer generator; the runner image has it, and asking
          # Chocolatey for it again is a no-op when it does. Its directory is
          # added to this process's PATH explicitly, because a Chocolatey install
          # updates the machine's PATH and not the one this step started with.
          choco install nsis --no-progress -y
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            Write-Error "makensis was not found, so no installer can be built."
            exit 1
          }
          # windeployqt runs from an install() rule, so CPack -- which installs
          # into its own staging directory -- produces a tree that carries Qt.
          Push-Location native/build
          cpack -G "NSIS;ZIP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem native/build -Filter *.exe | Where-Object { $_.Name -like "time-warp-studio-*" } | Move-Item -Destination dist
          Get-ChildItem native/build -Filter *.zip | Where-Object { $_.Name -like "time-warp-studio-*" } | Move-Item -Destination dist
          Get-ChildItem dist | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifact-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  build-macos:
    name: Build the macOS disk image
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The newest Qt: 6.8 and 6.9 link `-framework AGL`, which macOS 26's SDK no
      # longer has. Qt 6.12 is universal and declares macOS 14.4 as its floor.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          cache: true

      - name: Configure, as a universal bundle
        run: |
          # One disk image runs on Intel and on Apple silicon: Qt 6.12's macOS
          # package is universal, and so is everything else the bundle links, so
          # the application can be built for both at once. 14.4 is Qt 6.12's own
          # floor, which is what the bundle declares.
          cmake -S native -B native/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4 2>&1 | tee configure.log
          if grep -q "skipping the widget UI" configure.log; then
            echo "::error::Qt6 Widgets was not found, so the UI was skipped."
            exit 1
          fi
          cmake --build native/build --parallel

      - name: Test what is about to ship
        timeout-minutes: 30
        run: |
          ctest --test-dir native/build --timeout 180 --output-on-failure
          # Located rather than spelled out, so a rename of the bundle is a green
          # run with a different path in it instead of a broken release job.
          bundle=$(find native/build -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$bundle"
          app=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f | head -1)
          test -x "$app"
          "$app" --version
          "$app" --help > /dev/null
          # The window actually paints, offscreen: the same check the Linux and
          # Windows jobs make.
          "$app" --screenshot "${RUNNER_TEMP:-/tmp}/window.png"
          test -s "${RUNNER_TEMP:-/tmp}/window.png"
          # The bundle is only useful if what it needs is inside it: the icon,
          # the bridge, the examples, the snippets and the help pages.
          test -f "$bundle/Contents/Resources/time-warp-studio.icns"
          test -f "$bundle/Contents/Resources/share/time_warp/worker.py"
          test -d "$bundle/Contents/Resources/share/time-warp-studio/examples"
          test -f "$bundle/Contents/Resources/share/doc/time-warp-studio/INDEX.md"
          test -f "$bundle/Contents/Resources/share/time-warp-studio/snippets.json"

      - name: Package
        run: |
          # macdeployqt and the ad-hoc signature are install() rules as well, so
          # the disk image is built from a staged install rather than from the
          # build tree: what CPack packages is exactly what `cmake --install`
          # produces.
          cd native/build
          cpack -G DragNDrop
          # CPack signs nothing; the bundle it staged is the one install(CODE)
          # already signed, and the image is the copy that leaves the machine.
          cd ../..
          mkdir -p dist
          mv "native/build/Time_Warp_Studio-$(cat VERSION)-macOS-universal.dmg" dist/
          ( cd dist && shasum -a 256 *.dmg > "$(ls *.dmg | head -1).sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifact-universal
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  image:
    name: Publish the container image
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Time Warp Studio
            org.opencontainers.image.description=An old-school programming environment: ten languages, an IDE, an HB-1 home computer and a live CHIP-8
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}

  release:
    name: Create the GitHub Release
    needs: [verify, build, build-windows, build-macos, image]
    runs-on: ubuntu-24.04
    # The Deployment GitHub records points at the published release. Add required
    # reviewers to this environment in Settings > Environments if a release
    # should need a second pair of eyes; nothing else in the workflow changes.
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # `merge-multiple` puts both architectures' files in one directory: the
      # release attaches a flat list, and every file name already says which
      # architecture it is.
      # The notes name the image too, and the same lowercase rule applies to what
      # is printed as to what is pushed.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-artifact-*'
          merge-multiple: true
          path: dist

      - name: Create the release and attach the artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          tag="v${version}"

          # Generated notes come from the API rather than from
          # `gh release create --generate-notes`, because they have to sit under
          # a hand-written preamble (what to install, and how) and the flag does
          # not combine with supplied notes. Two bodies, one file, one release.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$tag" --jq .body > generated-notes.md

          {
            cat <<EOF
          An old-school programming environment for ten languages — BASIC, APL, Logo,
          PILOT, FOCAL, Scheme, CHIP-8, COMAL, REXX and Smalltalk — with integrated
          turtle graphics, all running in C++. Inside it are two complete machines:
          the HB-1, a bespoke 1982 home computer from a parallel universe with a
          ten-language ROM socket and its own disk operating system, and a live
          CHIP-8 with an assembler, keypad and register inspector.

          ### Which file do I want?

          Windows gets an installer and a portable ZIP, macOS one universal disk
          image, and Linux the packages below. On Linux, files come in two
          architectures: **x86_64** (Intel/AMD) and **arm64** (Raspberry Pi 4/5,
          ARM laptops). \`uname -m\` says which yours is: \`x86_64\` or
          \`aarch64\`. Each format spells it its own way — a \`.deb\` says
          \`amd64\`/\`arm64\`, an \`.rpm\` says \`x86_64\`/\`aarch64\`, and the
          tarball says \`x86_64\`/\`arm64\`.

          | If you… | Download | What happens |
          | --- | --- | --- |
          | use Windows 10 or 11 | \`time-warp-studio-${version}-win64.exe\` | Run it. It installs into Program Files with Start Menu and desktop shortcuts, and Qt travels inside it. The \`.zip\` beside it is the same application without an installer. |
          | use macOS 14.4 or later, Intel or Apple silicon | \`Time_Warp_Studio-${version}-macOS-universal.dmg\` | Open it, drag **Time Warp Studio** to Applications. One image, both architectures. |
          | just want to try it, on Linux Intel/AMD | \`Time_Warp_Studio-${version}-x86_64.AppImage\` | One file. Make it executable and double-click it. Nothing is installed and no root password is asked for. |
          | use Ubuntu, Debian, Mint or Pop!_OS | \`time-warp-studio_${version}_amd64.deb\` (or \`_arm64.deb\`) | Double-click it, or \`sudo apt install ./time-warp-studio_${version}_amd64.deb\`. Appears in the application menu. |
          | use Fedora, RHEL or openSUSE | \`time-warp-studio-${version}-1.x86_64.rpm\` (or \`.aarch64.rpm\`) | \`sudo dnf install ./time-warp-studio-${version}-1.x86_64.rpm\` |
          | want no desktop integration, or you are on Linux arm64 | \`time-warp-studio-${version}-linux-<arch>.tar.gz\` | \`tar -xzf time-warp-studio-${version}-linux-<arch>.tar.gz -C / --strip-components=1\` |
          | want it in a container | \`${IMAGE_NAME}:${version}\` | \`docker run --rm -e DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix ${IMAGE_NAME}:${version}\` |

          Checksums are beside every file (\`.sha256\`). The AppImage needs glibc
          2.39 or newer — Ubuntu 24.04 and later, or a distribution of similar age;
          on anything older, use the package for it. The macOS and Windows builds
          are not signed with a paid certificate: on macOS, right-click the
          application and choose Open the first time, and on Windows, choose
          "More info" then "Run anyway" in SmartScreen.

          See [CHANGELOG.md](CHANGELOG.md) for what changed and
          [docs/INSTALLATION.md](docs/INSTALLATION.md) for requirements.

          EOF
            echo "---"
            echo
            cat generated-notes.md
          } > release-notes.md

          # Re-dispatching a version that already has a release replaces it. The
          # artifacts are rebuilt from the same tagged tree, so the old ones are
          # duplicates of one version -- and two identical-looking downloads is
          # the worst possible outcome for the table above.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi

          gh release create "$tag" \
            --title "Time Warp Studio $version" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage \
            dist/*.exe dist/*.zip dist/*.dmg dist/*.sha256

      - name: Verify the release is public and complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ needs.verify.outputs.version }}" \
            --json tagName,assets,url --jq '{tag: .tagName, assets: [.assets[].name], url}'
