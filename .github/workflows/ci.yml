name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONPATH: Platforms/Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Platforms/Python/requirements*.txt
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxcb-cursor0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Platforms/Python/requirements.txt -r Platforms/Python/requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github Platforms/Python
      - name: Unit tests
        run: pytest -q --tb=short Platforms/Python/time_warp/tests
      - name: Smoke test
        run: python Platforms/Python/smoke_test.py
      - name: Example programs
        run: python test_all_examples.py
