name: Build Native Binaries

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Deployment channel (production is tag-only)
        required: true
        type: choice
        options:
          - preview
          - staging
        default: staging

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.channel || (github.event_name == 'pull_request' && 'preview') || (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip
          pip install -r Platforms/Python/requirements.txt
          pip install -e Platforms/Python
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          chmod +x Scripts/build_native.sh
          ./Scripts/build_native.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-warp-${{ inputs.channel || (github.event_name == 'pull_request' && 'preview') || (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}-linux-amd64
          path: dist/x86_64/*
          retention-days: 30

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.channel == 'staging')
    continue-on-error: true
    # Note: ARM runners require GitHub Team/Enterprise plan.
    environment:
      name: ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip
          pip install -r Platforms/Python/requirements.txt
          pip install -e Platforms/Python
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          chmod +x Scripts/build_native.sh
          ./Scripts/build_native.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: time-warp-${{ inputs.channel || (startsWith(github.ref, 'refs/tags/v') && 'production') || 'staging' }}-linux-arm64
          path: dist/aarch64/*
          retention-days: 30

  publish-production:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-linux-amd64.result == 'success' }}
    needs: [build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: time-warp-production-linux-*
          path: release-artifacts

      - name: Collect Linux packages
        run: |
          mkdir -p release-assets
          find release-artifacts -type f \( -name '*.deb' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -ge 2

      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build Platforms/Python
          cp Platforms/Python/dist/*.whl Platforms/Python/dist/*.tar.gz release-assets/

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { in_release = 1; next }
            in_release && /^## \[/ { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Generate checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Time Warp Studio ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
