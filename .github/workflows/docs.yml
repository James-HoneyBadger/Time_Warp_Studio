name: Docs

# Documentation that drifts from the thing it describes is worse than no
# documentation, because it is believed. This job is deliberately small and runs
# with nothing but python3 from the runner image: it has to answer in seconds, on
# every documentation change, and it must not depend on the C++ build.
#
# It watches `lessons.json` and the two commands as well as `docs/`, because the lesson
# plans are *generated* from the curriculum and the failure that matters is
# somebody editing the curriculum without regenerating them.

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'Examples/CATALOG.md'
      - 'native/bridge/time_warp/features/lessons.json'
      - 'native/tools/teach.cpp'
      - 'native/tools/check_doc_links.py'
      - 'native/tools/check_doc_claims.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'Examples/CATALOG.md'
      - 'native/bridge/time_warp/features/lessons.json'
      - 'native/tools/teach.cpp'
      - 'native/tools/check_doc_links.py'
      - 'native/tools/check_doc_claims.py'
      - '.github/workflows/docs.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: List Markdown docs
        run: |
          echo "Listing documentation files (Markdown)"
          find docs -type f -name "*.md" | sort

      - name: Every guide the index promises exists
        run: |
          set -euo pipefail
          missing=0
          for required in \
            docs/INDEX.md \
            docs/ARCHITECTURE.md \
            docs/INSTALLATION.md \
            docs/USER_GUIDE.md \
            docs/API.md \
            docs/LANGUAGE_GUIDE.md \
            docs/FAQ.md \
            docs/ROADMAP.md \
            docs/README_TESTING.md \
            docs/lessons/README.md \
            docs/lessons/student-guide.md \
            docs/lessons/teacher-guide.md \
            docs/lessons/FORMAT.md \
            docs/lessons/plans/README.md \
            docs/MACHINES.md \
            docs/hb1/README.md \
            docs/hb1/roms.md \
            docs/hb1/hb-dos.md \
            docs/hb1/config.md \
            docs/hb1/inside.md \
            docs/chip8/README.md \
            docs/chip8/assembly.md \
            docs/chip8/instruction-set.md
          do
            if [ ! -f "$required" ]; then
              echo "::error file=$required::promised by docs/INDEX.md, and not here"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "Every promised guide is present."

      # One tutorial per language, because docs/INDEX.md lists ten and a missing
      # one is invisible: the table still renders, with a dead link in it.
      - name: Every language has a tutorial
        run: |
          set -euo pipefail
          missing=0
          for language in basic pilot logo comal rexx scheme focal apl chip8 smalltalk
          do
            if [ ! -f "docs/tutorials/$language.md" ]; then
              echo "::error::no tutorial for $language (docs/tutorials/$language.md)"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "$(find docs/tutorials -maxdepth 1 -name '*.md' | wc -l) tutorials present."

      # The guides are a set of books that link to each other, and a dead link is
      # how a reader discovers the map is wrong. Checked with python3 alone, so a
      # documentation pull request does not depend on the C++ build.
      - name: Every relative link and anchor resolves
        run: python3 native/tools/check_doc_links.py

      # The stronger property: a path named in backticks exists, a name that was
      # deleted is discussed in the past tense, and a `make <target>` is a target.
      # Three claims of that shape went stale after 17.0 and no gate noticed, which
      # is what this step is for.
      - name: Every claim in the guides is still true
        run: |
          python3 native/tools/check_doc_claims.py --self-test
          python3 native/tools/check_doc_claims.py

