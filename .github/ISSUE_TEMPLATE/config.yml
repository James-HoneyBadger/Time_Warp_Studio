# Where to ask, and what this project will help with.
#
# `blank_issues_enabled` is left on: the three forms cover the common cases, but
# a repository that refuses a free-form issue ends up with the same report in a
# discussion thread or in an email, where it is harder to find and harder to
# close. The contact links are here so that the *documented* answer is the first
# one offered.
blank_issues_enabled: true
contact_links:
  - name: Read the documentation first
    url: https://github.com/James-HoneyBadger/Time_Warp_Studio/blob/main/docs/INDEX.md
    about: "Index of every guide: installation, the language reference, tutorials, lessons and architecture."
  - name: Is it already known?
    url: https://github.com/James-HoneyBadger/Time_Warp_Studio/blob/main/docs/ROADMAP.md
    about: What is deliberately not built yet. Themes, find/replace, auto-completion and the debugger panels are on this list.
  - name: Install, build and run
    url: https://github.com/James-HoneyBadger/Time_Warp_Studio/blob/main/docs/INSTALLATION.md
    about: Requirements, building from source, and what a troubleshooting failure usually means.
  - name: Questions and help
    url: https://github.com/James-HoneyBadger/Time_Warp_Studio/blob/main/.github/SUPPORT.md
    about: Where to ask, and what the maintainer can and cannot help with.
