# Ruff and mypy configuration for the harness scripts.
#
# This was `native/bridge/pyproject.toml` while a Python engine lived there and
# needed linting. The engine is gone; the scripts that drive `time_warp_check` and
# the documentation gates are the only Python left in the repository, and they are
# code -- they parse flags, walk directories and assert on output -- so they keep
# the same rules the engine had.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Fenced blocks in docstrings are documentation, not licence to reflow them.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# A script is allowed to be a script: `main()` at module level and side effects in
# it are what makes `python3 native/tools/example_smoke.py` work.
"*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
