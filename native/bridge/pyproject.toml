# Tool configuration for the language bridge.
#
# This is deliberately not a distributable package. It is the Python engine that
# `native/` runs for the five languages that have not been ported to C++ yet:
# the worker (../worker.py) spawns it and streams drawing commands back. It has
# no build system and no third-party dependencies -- the interpreter and the six
# language executors use the standard library only. Optional extras (pygame,
# inputs, pyttsx3) are imported defensively and only for BASIC's SOUND, GAMEPAD
# and SPEAK commands.
#
# The file exists so the lint and type gates that used to live in the removed
# PySide6 application's pyproject.toml still have somewhere to live.

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# PILOT keeps file handles open across statements; zip() lengths are pre-checked.
ignore = ["B905", "SIM115"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
